upstream backend {
    server backend:8080;
    keepalive 16;
}

# Cheap protection for the endpoints an anonymous caller can hammer. The
# application enforces its own limits too; this stops traffic earlier.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # `unsafe-inline` on styles is required by the runtime theming: the published
    # site configuration is injected as CSS custom properties on :root.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_catalog;
    }

    # Tighter bucket for credential endpoints.
    location ~ ^/api/(admin|customer)/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_catalog;
    }

    # --- WebSocket (live chat) ----------------------------------------------
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- uploaded media, served straight from the volume --------------------
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- hashed build assets ------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://backend/api/public/sitemap.xml;
        include /etc/nginx/proxy_params_catalog;
    }

    location = /robots.txt {
        proxy_pass http://backend/api/public/robots.txt;
        include /etc/nginx/proxy_params_catalog;
    }

    # --- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached, or a deploy leaves clients on
        # stale asset hashes.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
